<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Passport｜唯讀護照圖台</title>
<style>
:root{--ink:#173c38;--green:#0f766e;--mint:#e9f5f0;--line:#d8e5df;--paper:#fbfdfc;--amber:#b7791f;--red:#b42318;--muted:#66736e}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Segoe UI",sans-serif;color:#20332f;background:#edf3f0;height:100vh;display:flex;flex-direction:column}
header{height:68px;background:linear-gradient(110deg,#0b4f49,#16877d);color:white;display:flex;align-items:center;padding:0 24px;gap:14px;box-shadow:0 2px 12px #0002}
.logo{width:38px;height:38px;border:1px solid #ffffff70;border-radius:12px;display:grid;place-items:center;font-size:21px}.title h1{font-size:18px;margin:0}.title div{font-size:11px;opacity:.8;letter-spacing:.12em;margin-top:3px}.readonly{margin-left:auto;background:#fff2;border:1px solid #fff6;border-radius:999px;padding:7px 12px;font-size:12px}button{font:inherit}
main{display:grid;grid-template-columns:370px 1fr;min-height:0;flex:1}.side{background:#f8fbf9;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.tools{padding:16px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white}.filter-label{font-size:11px;color:var(--muted);margin:12px 0 6px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:5px 9px;font-size:11px;cursor:pointer}.chip.on{background:var(--ink);color:white;border-color:var(--ink)}
.count{font-size:12px;color:var(--muted);margin-top:11px}.list{overflow:auto;padding:8px;flex:1}.group-title{font-size:11px;font-weight:700;color:var(--muted);padding:10px 8px 4px}.item{background:white;border:1px solid var(--line);border-radius:10px;padding:11px;margin:5px;cursor:pointer}.item:hover,.item.active{border-color:var(--green);box-shadow:0 2px 9px #0f766e16}.item-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}.item-sub{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;border-radius:999px;padding:3px 7px;white-space:nowrap;background:#edf2f0;color:#42514c}.Available{background:#dff4e8;color:#17633b}.Unavailable{background:#f2f4f3;color:#596560}.Reserved{background:#fff0cf;color:#8a5908}.Allocated,.Installed{background:#e5ebff;color:#324aa8}.Approved{color:#17633b}.Pending{color:#96630b}.Rejected{color:var(--red)}
.detail{overflow:auto;padding:26px 30px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.hero{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}.hero h2{margin:0;font-size:23px;color:var(--ink)}.hero .meta{color:var(--muted);font-size:12px;margin-top:5px}.hero .spacer{flex:1}.refresh{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 11px;cursor:pointer}
.notice{background:#fff8e8;border:1px solid #efd9a6;color:#76510d;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px}.card.wide{grid-column:1/-1}.card h3{font-size:13px;color:var(--green);margin:0 0 12px;letter-spacing:.04em}.kv{display:grid;grid-template-columns:155px 1fr;gap:8px 12px;font-size:12px}.key{color:var(--muted)}.required-key{color:#5f4500;background:#e6bd4a;border-radius:5px;padding:3px 6px;font-weight:700}.required-value{background:#fff7cf;border-radius:5px;padding:3px 6px}.unknown{color:var(--amber);font-weight:600}.warning{color:var(--red)}
details{margin-top:8px}summary{cursor:pointer;color:var(--green);font-size:12px;font-weight:700}.table-wrap{overflow:auto;max-height:310px;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px;vertical-align:top}th{position:sticky;top:0;background:#eef6f2;color:var(--ink)}
@media(max-width:950px){main{grid-template-columns:310px 1fr}.cards{grid-template-columns:1fr}.card.wide{grid-column:auto}}@media(max-width:700px){main{display:block}.side{height:45vh}.detail{height:55vh;padding:16px}}
</style>
</head>
<body>
<header><div class="logo">♻</div><div class="title"><h1>Green Passport 循環建材護照</h1><div>MODEL EVIDENCE · REVIEW · TRACEABILITY</div></div><div class="readonly">🔒 網頁唯讀｜審核、配對與替換請回 Revit</div></header>
<main>
  <aside class="side"><div class="tools"><input id="search" class="search" placeholder="搜尋護照、模型、類型、材質"><div class="filter-label">供應狀態</div><div id="statusFilters" class="chips"></div><div class="filter-label">人工審核</div><div id="reviewFilters" class="chips"></div><div id="count" class="count">載入中…</div></div><div id="list" class="list"></div></aside>
  <section id="detail" class="detail"><div class="empty"><div><div style="font-size:42px">🪪</div><h3>選取一筆護照</h3><div>此圖台只呈現資料；不會執行核准、配對、預留或模型變更。</div></div></div></section>
</main>
<script>
const state={all:[],status:'全部',review:'全部',search:'',selected:null};
const statusNames={Unavailable:'未進入供應',Available:'可用',Reserved:'已預留',Allocated:'已配置',Installed:'已安裝'};
const reviewNames={Pending:'待審核',Approved:'已通過審核',"Repair Required":'需修復',Rejected:'未通過審核'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(v,suffix='')=>v===null||v===undefined||v===''||v===0?'<span class="unknown">待確認</span>':esc(v)+suffix;

async function load(){document.querySelector('#count').textContent='載入中…';try{const r=await fetch('/passports',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state.all=await r.json();filters();list();if(state.selected){const fresh=state.all.find(x=>x.id===state.selected.id);if(fresh)detail(fresh)}}catch(e){document.querySelector('#count').textContent='無法連到後端：'+e.message}}
function chipBox(id,items,key,names){const box=document.querySelector(id);box.innerHTML='';for(const item of items){const b=document.createElement('button');b.className='chip '+(state[key]===item?'on':'');b.textContent=(names[item]||item)+' '+(item==='全部'?state.all.length:state.all.filter(p=>p[key==='status'?'status':'reuseStatus']===item).length);b.onclick=()=>{state[key]=item;filters();list()};box.appendChild(b)}}
function filters(){chipBox('#statusFilters',['全部','Unavailable','Available','Reserved','Allocated','Installed'],'status',statusNames);chipBox('#reviewFilters',['全部','Pending','Approved','Repair Required','Rejected'],'review',reviewNames)}
function selected(){const q=state.search.toLowerCase();return state.all.filter(p=>(state.status==='全部'||p.status===state.status)&&(state.review==='全部'||p.reuseStatus===state.review)&&(!q||[p.passportId,p.sourceModel,p.typeName,p.family,p.material].some(x=>String(x||'').toLowerCase().includes(q))))}
function list(){const values=selected();document.querySelector('#count').textContent=`共 ${state.all.length} 筆，顯示 ${values.length} 筆`;const groups={};for(const p of values)(groups[p.sourceModel||'未命名模型']??=[]).push(p);const root=document.querySelector('#list');root.innerHTML='';for(const [model,rows] of Object.entries(groups)){const title=document.createElement('div');title.className='group-title';title.textContent=`${model} · ${rows.length}`;root.appendChild(title);for(const p of rows){const n=document.createElement('div');n.className='item '+(state.selected?.id===p.id?'active':'');n.innerHTML=`<div class="item-top"><span>${esc(p.passportId)}</span><span class="pill ${esc(p.status)}">${esc(statusNames[p.status]||p.status)}</span></div><div class="item-sub">${esc(p.typeName||'未命名類型')}｜<span class="${esc(p.reuseStatus)}">${esc(reviewNames[p.reuseStatus]||p.reuseStatus)}</span>｜${esc(p.material||'材質待確認')}</div>`;n.onclick=()=>{state.selected=p;list();detail(p)};root.appendChild(n)}}}
function sourcesRows(p){return Object.entries(p.fieldSources||{}).map(([field,s])=>`<tr><td>${esc(field)}</td><td>${esc(s.kind||'unknown')}</td><td>${esc(s.scope||'')} ${esc(s.parameterName||'')}</td><td>${esc(s.definition||'')}</td><td>${esc(s.verification||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="unknown">沒有欄位來源紀錄</td></tr>'}
function rawRows(p){return (p.rawParameters||[]).map(x=>`<tr><td>${esc(x.scope)}</td><td>${esc(x.name)}</td><td>${esc(x.displayValue||x.rawValue)}</td><td>${esc(x.unit||'')}</td><td>${esc(x.builtin||x.parameterId)}</td></tr>`).join('')||'<tr><td colspan="5" class="unknown">沒有模型參數快照</td></tr>'}
function warnings(p){const rows=p.mappingWarnings||[];return rows.length?'<ul class="warning">'+rows.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'沒有映射警告'}
function detail(p){document.querySelector('#detail').innerHTML=`
<div class="hero"><div><h2>${esc(p.passportId)}</h2><div class="meta">${esc(p.family)} / ${esc(p.typeName)}｜Revision ${p.revision||0}｜更新 ${esc(p.updatedAt||'待確認')}</div></div><div class="spacer"></div><span class="pill ${esc(p.reuseStatus)}">${esc(reviewNames[p.reuseStatus]||p.reuseStatus)}</span><span class="pill ${esc(p.status)}">${esc(statusNames[p.status]||p.status)}</span><button class="refresh" onclick="load()">重新整理</button></div>
<div class="notice">淡黃色的「＊必填」欄位必須完成才可 Approved／Matched。模型欄位只是資料來源，不等於現場實測或性能證明；只有 Revit 外掛中的人工檢核能改變核准與供應狀態。</div>
<div class="cards">
<article class="card"><h3>識別與追蹤</h3><div class="kv"><div class="key">來源模型</div><div>${val(p.sourceModel)}</div><div class="key">Element ID</div><div>${val(p.sourceElementId)}</div><div class="key">Unique ID</div><div>${val(p.sourceUniqueId)}</div><div class="key">目標模型／Element</div><div>${p.targetModel?esc(p.targetModel)+' / '+esc(p.targetElementId):'<span class="unknown">尚未配置</span>'}</div></div></article>
<article class="card"><h3>人工檢核與供應</h3><div class="kv"><div class="key">再利用資格</div><div>${val(reviewNames[p.reuseStatus]||p.reuseStatus)}</div><div class="key">供應狀態</div><div>${val(statusNames[p.status]||p.status)}</div><div class="key">保存狀況／等級</div><div>${val(p.condition)} / ${val(p.conditionGrade)}</div><div class="key">審核說明</div><div>${val(p.reviewNote)}</div><div class="key">檢核人／日期</div><div>${val(p.inspectedBy)} / ${val(p.inspectedOn)}</div><div class="key">數量／價格</div><div>${p.quantity||0} / NT$ ${p.priceNtd||0}</div></div></article>
<article class="card"><h3>八項核心配對資料</h3><div class="kv"><div class="key required-key">＊門寬 × 門高</div><div class="required-value">${val(p.widthMm,' mm')} × ${val(p.heightMm,' mm')}（${val(p.dimensionDefinition)}）</div><div class="key required-key">＊門扇厚度</div><div class="required-value">${val(p.leafThicknessMm,' mm')}</div><div class="key required-key">＊開啟方式／方向</div><div class="required-value">${val(p.operationType)} / ${val(p.swingHanding)}</div><div class="key required-key">＊室內外用途</div><div class="required-value">${val(p.useType)}</div><div class="key required-key">＊門扇材料</div><div class="required-value">${val(p.material)}</div><div class="key required-key">＊有效通行淨寬</div><div class="required-value">${val(p.clearWidthMm,' mm')}</div><div class="key">門扇數</div><div>${val(p.leafCount)}</div></div></article>
<article class="card wide"><h3>資料品質與可追溯性</h3><div>${warnings(p)}</div><details><summary>核心欄位來源（${Object.keys(p.fieldSources||{}).length}）</summary><div class="table-wrap"><table><thead><tr><th>欄位</th><th>來源</th><th>參數</th><th>定義</th><th>驗證聲明</th></tr></thead><tbody>${sourcesRows(p)}</tbody></table></div></details><details><summary>完整 Revit 實體＋類型參數（${(p.rawParameters||[]).length}）</summary><div class="table-wrap"><table><thead><tr><th>範圍</th><th>參數</th><th>值</th><th>單位</th><th>ID</th></tr></thead><tbody>${rawRows(p)}</tbody></table></div></details></article>
</div>`}
document.querySelector('#search').oninput=e=>{state.search=e.target.value;list()};load();
window.addEventListener('focus',()=>load());
</script>
</body></html>
