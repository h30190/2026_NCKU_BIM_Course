<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管道間檢討</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #e9eae9;
    --surface: #ffffff;
    --side: #f6f6f5;
    --ink: #121314;
    --muted: #6b7075;
    --line: #e7e8e6;
    --hover: #f2f3f1;
    --btn: #121314;
    --btn-ink: #ffffff;
    --red: #c8102e;     --red-t: #fdeaed;
    --amber: #a8650a;   --amber-t: #fdf2de;
    --green: #1f7a54;   --green-t: #e6f4ec;
    --blue: #2b5f8a;    --blue-t: #e8f0f7;
    --violet: #7b3fc4;  --violet-t: #f1e9fb;
    --c-elec: #c98a00; --c-water: #2563eb; --c-fire: #e11d48; --c-hvac: #0d9488; --c-gas: #ea580c; --c-air: #7c8691; --c-other: #94a3b8;
    --text: "Inter", "Noto Sans TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1213; --surface: #191d1f; --side: #151819; --ink: #eceeed; --muted: #959ca1; --line: #2a3033;
      --hover: #222729; --btn: #eceeed; --btn-ink: #121314;
      --red: #ff6b7d; --red-t: #3a1d23; --amber: #f0a944; --amber-t: #382b17; --green: #5cc495; --green-t: #183027;
      --blue: #7fb2dc; --blue-t: #1b2a37; --violet: #c29bf0; --violet-t: #2a2038;
      --c-elec: #f2b84b; --c-water: #6ea1ff; --c-fire: #ff6b8a; --c-hvac: #3cc7b6; --c-gas: #ff9a5c; --c-air: #a3adb8; --c-other: #8796a8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--text); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .ic { width: 16px; height: 16px; flex: none; }
  i[data-ic] { display: inline-flex; }

  /* ---------- 外框 ---------- */
  .frame { padding: 20px; }
  .app {
    display: grid; grid-template-columns: 272px minmax(0, 1fr);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: clip;
    min-height: calc(100vh - 40px);
  }

  /* ---------- 側欄 ---------- */
  .side {
    background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    position: sticky; top: 20px; height: calc(100vh - 42px); align-self: start;
  }
  .side-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 8px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; }
  .logo { width: 34px; height: 34px; border-radius: 6px; background: var(--ink); color: var(--surface); display: grid; place-items: center; }
  .logo .ic { width: 19px; height: 19px; }
  .brand b { display: block; font-size: 15px; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 12px; }

  .nav { display: grid; gap: 2px; margin-bottom: 10px; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-size: 14px;
  }
  .nav button .ic { color: var(--muted); }
  .nav button:hover { background: var(--hover); }
  .nav button.on { background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.04); font-weight: 500; }
  .nav button.on .ic { color: var(--ink); }
  .nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; text-align: center; line-height: 20px; }

  .grp { font-size: 11px; letter-spacing: .06em; color: var(--muted); margin: 18px 6px 8px; text-transform: none; }
  .field { display: grid; gap: 4px; margin: 0 6px 12px; }
  .field > label { font-size: 12px; color: var(--muted); }
  .field select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  }
  .rules { display: grid; gap: 2px; }
  .rules label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .rules label span { color: var(--muted); }
  .rules input { accent-color: var(--ink); }
  .ruleset { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .rgroup-h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin: 10px 0 2px; }
  .rgroup-h .ic { width: 14px; height: 14px; color: var(--muted); }
  .rgroup-h button { margin-left: auto; }
  .tgroup { margin: 0 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .tgroup > summary { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; list-style: none; }
  .tgroup > summary::-webkit-details-marker { display: none; }
  .tgroup > summary .ic { width: 14px; height: 14px; color: var(--muted); }
  .tgroup > summary .chev { margin-left: auto; transition: transform .15s; }
  .tgroup[open] > summary .chev { transform: rotate(90deg); }
  .tgroup > summary .dotc { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); display: none; }
  .tgroup.changed > summary .dotc { display: inline-block; }
  .tgroup .threshold { margin: 2px 10px 12px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip:hover { border-color: var(--ink); color: var(--ink); }

  .threshold { margin: 0 6px 14px; }
  .threshold .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; }
  .threshold .row label { color: var(--muted); }
  .numbox { display: inline-flex; align-items: baseline; gap: 3px; padding: 1px 6px; border: 1px solid transparent; border-radius: 5px; cursor: text; }
  .numbox:hover { border-color: var(--line); background: var(--surface); }
  .numbox:focus-within { border-color: var(--ink); background: var(--surface); }
  .numbox input { width: 5.2ch; border: 0; padding: 0; background: transparent; text-align: right; font-weight: 600; font-size: 13px; outline: 0; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
  .numbox input::-webkit-outer-spin-button, .numbox input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .numbox em { font-style: normal; font-size: 12px; color: var(--muted); }
  .numbox.changed input { color: var(--blue); }
  .threshold input[type=range] { width: 100%; accent-color: var(--ink); margin: 2px 0 0; }
  .whatif-note { display: none; margin: 4px 6px 8px; padding: 8px 10px; border-radius: 6px; background: var(--blue-t); color: var(--blue); font-size: 12.5px; }
  .whatif-note.on { display: block; }
  .link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; font-size: inherit; }

  .plan { margin: 8px 14px 14px; padding: 14px; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.05); }
  .plan .st { display: grid; gap: 2px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .plan .st b { color: var(--ink); font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn { display: inline-flex; align-items: center; gap: 6px; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .conn.ok i { background: var(--green); box-shadow: 0 0 0 3px var(--green-t); }
  .conn.bad i { background: var(--red); }

  /* ---------- 按鈕 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 13px; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.dark { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .btn.dark:hover { opacity: .88; }
  .btn.block { width: 100%; padding: 9px 12px; }
  .btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
  .btn.red { color: var(--red); border-color: var(--red-t); background: var(--red-t); }
  .btn[disabled] { opacity: .5; cursor: progress; }

  /* ---------- 主區 ---------- */
  .main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top .pg { width: 34px; height: 34px; border-radius: 6px; background: var(--hover); display: grid; place-items: center; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .top .sp { flex: 1; }
  .top .stamp { color: var(--muted); font-size: 12.5px; }
  .top .acts { display: flex; gap: 8px; }
  .body { padding: 18px 24px 40px; display: grid; gap: 14px; }

  .banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .banner .ico { width: 36px; height: 36px; border-radius: 6px; background: var(--hover); display: grid; place-items: center; flex: none; }
  .banner .t { flex: 1; font-size: 14.5px; min-width: 0; }
  .banner .t b { font-weight: 600; }
  .banner .t small { display: block; color: var(--muted); font-size: 12.5px; }
  .banner.warn { background: var(--amber-t); border-color: transparent; color: var(--amber); padding: 10px 14px; font-size: 13px; }
  .banner.warn .ico { background: transparent; width: 20px; height: 20px; }
  .banner.info { background: var(--blue-t); border-color: transparent; color: var(--blue); padding: 10px 14px; font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .stat:hover { background: var(--hover); }
  .stat.on { box-shadow: 0 0 0 2px var(--ink); }
  .stat .h { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  .stat .n { font-size: 30px; font-weight: 600; line-height: 1.2; margin-top: 4px; letter-spacing: -.01em; }
  .stat .n small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .stat.r .h .ic { color: var(--red); } .stat.g .h .ic { color: var(--green); } .stat.a .h .ic { color: var(--amber); } .stat.o .h .ic { color: var(--amber); }

  .gstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .gstat { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .gstat:hover { background: var(--hover); }
  .gstat.on { box-shadow: 0 0 0 2px var(--ink); }
  .gstat .gi { width: 34px; height: 34px; border-radius: 6px; background: var(--hover); display: grid; place-items: center; flex: none; }
  .gstat .gi .ic { width: 18px; height: 18px; }
  .gstat .t { font-size: 13px; font-weight: 500; }
  .gstat .s { font-size: 12px; color: var(--muted); }
  .gstat .s b { color: var(--red); font-weight: 600; }
  .gstat .s b.ok { color: var(--green); }
  .gstat .s b.am { color: var(--amber); }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; padding: 3px; background: var(--hover); border-radius: 7px; gap: 2px; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 5px 12px; border-radius: 5px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
  .toolbar .sp { flex: 1; }
  .filter-note { font-size: 12.5px; color: var(--muted); }

  .card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 500; }
  .card-h small { color: var(--muted); font-weight: 400; }

  /* ---------- 清單 ---------- */
  .list-head, .shaft-row {
    display: grid; grid-template-columns: 118px 96px 48px 116px repeat(4, minmax(70px, 1fr)) 60px;
    align-items: center; gap: 10px; padding: 10px 16px;
  }
  .list-head .gh { display: inline-flex; align-items: center; gap: 4px; }
  .gcell { display: inline-flex; align-items: center; gap: 4px; justify-self: start; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; }
  .gcell .ic { width: 13px; height: 13px; }
  .g-pass { background: var(--green-t); color: var(--green); }
  .g-violation { background: var(--red-t); color: var(--red); }
  .g-missing, .g-warning { background: var(--amber-t); color: var(--amber); }
  .g-none { background: transparent; color: var(--muted); }
  .gcell .gl { display: none; font-weight: 600; margin-right: 2px; }
  .d-box-h .gcell .gl, .kcard .gcell .gl { display: none; }
  .list-head { font-size: 12px; color: var(--muted); background: var(--side); border-bottom: 1px solid var(--line); }
  .shaft + .shaft { border-top: 1px solid var(--line); }
  .shaft-row { cursor: pointer; }
  .shaft-row:hover, .shaft.open .shaft-row { background: var(--hover); }
  .no { font-weight: 600; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .lv { color: var(--muted); }
  .dims { font-weight: 500; font-variant-numeric: tabular-nums; }
  .dims small { color: var(--muted); font-weight: 400; margin-left: 2px; font-size: 12px; }
  .glyph { display: block; }
  .glyph .room { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .glyph .room.fail { stroke: var(--red); fill: var(--red-t); }
  .glyph .min { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-pass { background: var(--green-t); color: var(--green); }
  .p-violation { background: var(--red-t); color: var(--red); }
  .p-missing, .p-warning { background: var(--amber-t); color: var(--amber); }
  .p-guess { background: var(--violet-t); color: var(--violet); }
  .p-link { background: var(--blue-t); color: var(--blue); }
  .p-plain { background: var(--hover); color: var(--muted); }
  .locate { justify-self: end; }

  .detail { display: none; padding: 4px 16px 16px; background: var(--hover); }
  .shaft.open .detail { display: block; }
  .detail-in { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  .detail-in.stack { grid-template-columns: 1fr; }
  .d-col { display: grid; gap: 10px; min-width: 0; }
  .d-box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .d-box-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--side); border-bottom: 1px solid var(--line); font-weight: 500; font-size: 13px; }
  .d-box-h .sp { flex: 1; }
  .d-box-b { padding: 2px 12px 8px; }
  .d-box.ok .d-box-b { padding: 8px 12px; color: var(--muted); font-size: 12.5px; }
  .sugg { grid-column: 2 / 4; display: flex; gap: 8px; align-items: flex-start; margin-top: 4px; padding: 7px 10px; border-radius: 6px; background: var(--blue-t); color: var(--blue); font-size: 12.5px; }
  .sugg .ic { margin-top: 2px; }
  .plan-box { position: sticky; top: 12px; }
  .plan-svg { display: block; width: 100%; height: auto; }
  .plan-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .plan-meta b { display: block; color: var(--ink); font-size: 13.5px; font-weight: 600; }
  .legend-sm { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .legend-sm i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .plan-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .issue { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .issue:first-child { border-top: 0; }
  .issue .rid { font-weight: 600; }
  .issue .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; text-align: right; }
  .issue .ref { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  .issue .ids { grid-column: 2 / 4; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .issue .ids .ic { width: 13px; height: 13px; }
  .issue.pick { cursor: pointer; margin: 0 -8px; padding: 10px 8px; border-radius: 6px; }
  .issue.pick:hover { background: var(--hover); }
  .issue.pick:hover .ids { color: var(--blue); }
  .issue.pick.on { background: var(--blue-t); box-shadow: inset 3px 0 0 var(--blue); }
  .rchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px; color: var(--ink); }
  .rchip b { font-weight: 600; font-size: 12px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--red-t); color: var(--red); text-align: center; }
  .rchip.zero b { background: var(--green-t); color: var(--green); }
  .rchip:hover { border-color: var(--ink); }
  .rchip.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .rchip.on b { background: rgba(255,255,255,.18); color: inherit; }
  .rsec { overflow: visible; }
  .rsec-h { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--side); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; flex-wrap: wrap; }
  .rsec.ok .rsec-h { border-bottom: 0; border-radius: 8px; }
  .rsec-h .rid { font-weight: 700; font-size: 15px; }
  .rsec-t { display: grid; min-width: 0; flex: 1 1 260px; }
  .rsec-t small { color: var(--muted); font-size: 11.5px; }
  .rsec-h .sp { flex: 0 0 0; }
  .rsec-n { font-size: 12px; color: var(--muted); }
  .irow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 120px 56px; gap: 4px 14px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--line); }
  .irow:first-of-type { border-top: 0; }
  .irow.pick { margin: 0; border-radius: 0; padding: 10px 16px; }
  .irow-sh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 1px; }
  .irow-sh .lv { color: var(--muted); font-size: 12.5px; }
  .irow-main { display: grid; gap: 4px; min-width: 0; font-size: 13.5px; }
  .irow-main .sugg { margin-top: 2px; grid-column: auto; }
  .irow-main .ids { grid-column: auto; }
  .irow-val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .plan-svg [data-pick] { cursor: pointer; }
  .plan-svg [data-pick]:hover { opacity: .7; }
  .issue.v .rid, .issue.v .msg { color: var(--red); }
  .issue.m .rid, .issue.w .rid { color: var(--amber); }
  .passed { font-size: 12.5px; color: var(--muted); padding: 10px 0 6px; border-top: 1px solid var(--line); }
  .why { padding: 10px 12px; font-size: 13px; }
  .why .score { font-weight: 600; margin-left: 6px; }
  .why .acts { margin-top: 6px; display: flex; gap: 14px; font-size: 12.5px; }
  .reasons { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }

  /* ---------- 看板 ---------- */
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
  .col-h { display: flex; align-items: center; gap: 8px; }
  .col-h .pill b { font-weight: 600; margin-left: 2px; }
  .col-h small { color: var(--muted); font-size: 12px; }
  .kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 8px; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  button.kcard:hover { border-color: var(--ink); }

  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .22s; z-index: 21; display: flex; flex-direction: column; }
  body.drawer-open .drawer-bg { opacity: 1; pointer-events: auto; }

  .drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .drawer-h h3 { margin: 0; font-size: 16px; flex: 1; }
  .drawer-b { padding: 16px 18px; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
  .iconbtn { width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .iconbtn:hover { background: var(--hover); }

  /* ---------- 辨識結果 ---------- */
  .detect-panel { display: grid; gap: 14px; }
  .src { color: var(--muted); font-size: 12.5px; }

  .cand-dims { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .cand-dims b { color: var(--ink); }
  .cand-actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
  .plain-list { margin: 0; padding: 12px 16px 14px 34px; font-size: 13px; color: var(--muted); }
  .bulk { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

  .notice { padding: 22px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 680px; }
  .notice h3 { margin: 0 0 6px; font-size: 16px; }
  .notice p { margin: 0 0 8px; color: var(--muted); }
  .notice.err { border-color: var(--red); }

  .toast { position: fixed; right: 24px; bottom: 24px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 6px; font-size: 13.5px; max-width: 420px; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: var(--red); color: #fff; }

  @media (max-width: 1000px) {
    .frame { padding: 0; }
    .app { grid-template-columns: 1fr; border-radius: 0; border: 0; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .side-scroll { overflow: visible; }
    .list-head { display: none; }
    .shaft-row { grid-template-columns: 1fr auto; gap: 6px 12px; }
    .shaft-row { grid-template-columns: repeat(4, auto) 1fr; }
    .shaft-row .no { grid-column: 1 / 5; }
    .shaft-row .locate { grid-column: 5; grid-row: 1; }
    .shaft-row .g, .shaft-row .lv, .shaft-row .dims { display: none; }
    .shaft-row .gcell .gl { display: inline; }
    .shaft-row .gcell .st { display: none; }
    .irow { grid-template-columns: 1fr auto; }
    .irow-main { grid-column: 1 / 3; }
    .irow-val { grid-column: 1; text-align: left; }
    .detail-in { grid-template-columns: 1fr; }
    .plan-box { position: static; }
    .body, .top { padding-left: 16px; padding-right: 16px; }
    .cand { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer, .drawer-bg, .toast { transition: none; } }

<!-- ===== Vercel 風格（模擬）：白紙上的終端機排版。#fafafa 畫布、#171717 文字、細線框、6px 圓角、Geist Mono 標籤 ===== -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  :root, :root:not([data-theme="light"]) {
    --paper: #fafafa;
    --white: #ffffff;
    --hair: #ebebeb;
    --obsidian: #171717;
    --charcoal: #4d4d4d;
    --stone: #666666;
    --graph: #8f8f8f;
    --tgreen: #297a3a;
    --ring: 0 0 0 1px rgba(0,0,0,.08), 0 0 0 2px #fafafa;

    --bg: var(--paper);
    --surface: var(--white);
    --side: var(--paper);
    --ink: var(--obsidian);
    --muted: var(--stone);
    --line: var(--hair);
    --hover: #f2f2f2;
    --btn: var(--obsidian);
    --btn-ink: #ffffff;

    /* 狀態：只用文字色與小圓點表達，不用彩色底塊；合格沿用 Terminal Green */
    --red: #c62a2f;     --red-t: transparent;
    --amber: #a35c00;   --amber-t: transparent;
    --green: var(--tgreen); --green-t: transparent;
    --blue: var(--obsidian); --blue-t: #f4f4f4;
    --violet: var(--charcoal); --violet-t: transparent;
    --c-elec: #b08a00; --c-water: #2a62d6; --c-fire: #c62a2f; --c-hvac: #0f7c70; --c-gas: #c9611c; --c-air: #8f8f8f; --c-other: #a8a8a8;

    --text: "Geist", "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei UI", sans-serif;
    --mono: "Geist Mono", "Noto Sans TC", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --spectrum: linear-gradient(90deg, rgb(0,255,149) 0%, rgb(255,208,0) 25%, rgb(255,23,68) 50%, rgb(149,0,255) 75%, rgb(0,229,255) 100%);
  }

  body { background: var(--paper); color: var(--obsidian); font: 400 14px/1.5 var(--text); font-feature-settings: "calt" 0, "rlig", "ss11"; }

  /* 小標籤一律 Geist Mono 大寫 */
  .grp, .list-head, .field > label, .stat .h span, .plan .st span, .plan-meta span, .rsec-n, .col-h small,
  .filter-note, .issue .ref, .top .stamp, .legend-sm {
    font-family: var(--mono); letter-spacing: .071em;
  }
  .grp, .list-head, .stat .h span, .plan .st > span { text-transform: uppercase; font-size: 11px; color: var(--obsidian); }
  .issue .rid, .rsec-h .rid, .gcell, .pill, .dims, .issue .val, .irow-val, .stat .n small, .count, .numbox input, .numbox em, .rchip b { font-family: var(--mono); }

  /* ---------- 外框：整頁白紙，頂列貼齊，不做浮動卡 ---------- */
  .frame { padding: 0; }

  .side { background: var(--paper); border-right: 1px solid var(--hair); top: 0; height: 100vh; }
  .side-scroll { padding: 18px 16px 8px; }

  .logo .ic { display: none; }
  .logo::before { content: "▲"; font-size: 18px; line-height: 1; color: #000; }
  .brand b { font-weight: 500; letter-spacing: -.01em; }
  .brand small { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--stone); }
  .nav button { border-radius: 6px; color: var(--charcoal); }

  .nav button.on { background: var(--white); box-shadow: var(--ring) !important; color: var(--obsidian); font-weight: 500; }
  .nav .count { background: var(--obsidian); color: #fff; border-radius: 9999px; font-weight: 500; }
  .field select { border-radius: 6px; border: 0; box-shadow: var(--ring) !important; background: #fff; }
  .rules label { color: var(--obsidian); }

  .chip { border-radius: 9999px; border: 1px solid var(--hair); background: #fff; color: var(--charcoal); font-family: var(--mono); font-size: 11px; letter-spacing: .05em; }
  .chip:hover { border-color: var(--obsidian); color: var(--obsidian); }

  /* ---------- 按鈕：6px 圓角，黑底白字為主要、細線為次要 ---------- */
  .btn { border-radius: 6px; border: 0; background: #fff; color: var(--charcoal); box-shadow: 0 0 0 1px var(--hair) !important; font-weight: 400; }

  .btn.dark { background: var(--obsidian); color: #fff; box-shadow: none !important; }

  /* ---------- 頂列：64px、毛玻璃、無底線 ---------- */

  /* ---------- 摘要：超大字、無背景圖，下方一道光譜細線 ---------- */
  #banner > .banner:first-child { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 20px; padding: 24px 0 28px; border: 0; border-radius: 0; background: transparent; }

  #banner > .banner:first-child .t::before { content: "管道間檢討 · SUMMARY"; display: block; margin-bottom: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .071em; color: var(--obsidian); }
  #banner > .banner:first-child .t { font-weight: 450; font-size: clamp(32px, 3.2vw, 60px); line-height: 1.0; letter-spacing: -.05em; }
  #banner > .banner:first-child .t b { font-weight: 450; }
  #banner > .banner:first-child .t small { margin-top: 14px; font-size: 14px; line-height: 1.5; letter-spacing: 0; color: var(--charcoal); max-width: 760px; }
  #banner > .banner:first-child .btn { background: var(--obsidian); color: #fff; box-shadow: none !important; }
  .banner.warn, .banner.info { background: #fff; border: 0; border-radius: 6px; box-shadow: var(--ring) !important; color: var(--charcoal); font-family: var(--mono); font-size: 12px; letter-spacing: .02em; padding: 10px 14px; }
  .banner.warn .ico { color: var(--amber); }

  /* ---------- 統計卡：白卡 + 雙層細線框 ---------- */
  .stat, .gstat { background: #fff; border: 0; border-radius: 6px; box-shadow: var(--ring) !important; padding: 16px; }
  .stat:hover, .gstat:hover { background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.22), 0 0 0 2px #fafafa !important; }
  .stat.on, .gstat.on { background: var(--obsidian); color: #fff; box-shadow: none !important; }
  .stat.on .h span, .stat.on .n small, .gstat.on .s { color: #c9c9c9; }
  .gstat.on .gi { background: #2b2b2b; color: #fff; }
  .stat .h .ic { width: 14px; height: 14px; }
  .stat .n { font-weight: 450; font-size: 36px; letter-spacing: -.05em; line-height: 1.05; margin-top: 10px; }
  .stat .n small { letter-spacing: 0; font-size: 12px; }
  .gstat .gi { background: var(--paper); border-radius: 6px; box-shadow: 0 0 0 1px var(--hair) !important; }
  .gstat .t { font-weight: 500; }
  .gstat .s { color: var(--stone); font-family: var(--mono); font-size: 11.5px; }

  /* ---------- 工具列 ---------- */
  .seg { background: #fff; border-radius: 6px; box-shadow: var(--ring) !important; padding: 2px; }
  .seg button { border-radius: 4px; color: var(--stone); }

  .filter-note { font-size: 11.5px; color: var(--charcoal); }
  .link { color: var(--obsidian); text-decoration-color: #c9c9c9; text-underline-offset: 3px; }
  .rchip { border-radius: 9999px; background: #fff; border: 1px solid var(--hair); color: var(--charcoal); }
  .rchip:hover { border-color: var(--obsidian); color: var(--obsidian); }
  .rchip.on { background: var(--obsidian); border-color: var(--obsidian); color: #fff; }
  .rchip b { background: transparent; color: var(--red); padding: 0; min-width: 0; }
  .rchip.zero b { background: transparent; color: var(--tgreen); }
  .rchip.on b { color: #fff; background: transparent; }

  /* ---------- 卡片與清單 ---------- */
